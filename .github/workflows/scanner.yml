name: NSE Catalyst Scanner

on:
  workflow_dispatch: # This allows you to manually trigger it from the Actions tab
  # schedule:
  #   - cron: '0 * * * *' # Uncomment this if you want GitHub to run it automatically every hour

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Download NLTK Data
        run: |
          python -c "import nltk; nltk.download('punkt_tab'); nltk.download('punkt')"

      - name: Run Scanner
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          CATALYST_SCORE_THRESHOLD: ${{ secrets.CATALYST_SCORE_THRESHOLD }}
        run: |
          python main.py
